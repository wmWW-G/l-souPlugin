      type: custom
      data:
        type: if-else
        title: 是否有可分析事实
        desc: ''
        selected: false
        cases:
        - id: 'true'
          case_id: 'true'
          logical_operator: and
          conditions:
          - id: ready
            comparison_operator: '='
            value: '1'
            varType: number
            variable_selector:
            - prepare
            - valid
      position:
        x: 688
