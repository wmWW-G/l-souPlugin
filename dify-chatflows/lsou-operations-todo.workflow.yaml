    - id: retrieval_input
      type: custom
      data:
        type: code
        title: 准备本轮检索主题与事实摘要
        desc: ''
        selected: false
        code_language: python3
        code: |
          """只组装本轮知识检索输入，不读取外部资料或修改业务数据。"""
          import json
          import logging
          import re
          TOPICS = {'overview': '经营目标与诊断、指标口径、同行对标、周期与去重、商机质量、商品国家渠道贡献、阶段任务与复盘', 'visitor': '询盘质量、采购需求澄清、客户优先级、响应与分配记录、报价样品跟进、有效需求反馈、回复草稿', 'product': '商品成长、四象限与本店相对表现、核心产品培育、质量与内容缺项、标题属性一致性、价格MOQ、自然付费流量与复查', 'flow': '渠道归因、国家偏好、流量规模与需求匹配、搜索词与承接、曝光点击商机诊断、周期分母与竞争性解释', 'market': '市场与商品组合、子类目国家需求、供需竞争、目标客群、企业供货能力、价格MOQ认证、候选选品与价值主张', 'ads': '关键词库、采购意图、主词属性场景、去重与排除词、计划商品国家词创意报表、广告样本与归因、预算约束与复查'}


          def query_text(value, limit):
              """生成有界查询摘要；value为输入文本，limit为字符上限；返回脱敏文本，非法类型返回空。"""
              if not isinstance(value, str):
                  return ''
              value = re.sub(r'https?://\S+|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}', '[联系方式或链接省略]', value)
              value = re.sub(r'(?<!\w)\+?\d[\d ()-]{7,}\d(?!\w)', '[长编号省略]', value)
              value = re.sub(r'\b(?:app-|s_|f_|p_)[A-Za-z0-9_-]{6,}\b', '[内部引用省略]', value)
              return ' '.join(value.split())[:limit]


          def build_retrieval(context: str, question: str, analysis: str, selection: str) -> dict:
              """准备检索材料；参数均来自已校验准备节点；返回请求文本和保底查询，非法上下文抛ValueError。"""
              data = json.loads(context)
              module = data['module']
              topics = TOPICS[module]
              question = query_text(question, 800)
              chosen = json.loads(selection)
              report = json.loads(analysis)
              if not isinstance(chosen, dict):
                  chosen = {}
              # 对象匹配先于样本顺序，追问具体商品时优先提供它的真实记录。
              facts = list(data['facts'])
              ref = chosen.get('entity_ref', '')
              if ref:
                  facts.sort(key=lambda fact: fact.get('entity_ref') != ref)
              facts = [{'label': query_text(fact['label'], 120), 'text': query_text(fact['text'], 450),
                        'scope': query_text(fact['scope'], 160)} for fact in facts[:6]]
              previous = None
              if isinstance(report, dict) and report.get('module') == module and report.get('snapshot_id') == data['snapshot_id']:
                  # 原分析是可选材料；形状异常时跳过其主题，不能因此阻断基于本轮事实的问答。
                  findings = report.get('tasks', [])
                  if not isinstance(findings, list):
                      findings = []
                  previous = {'summary': query_text(report.get('summary'), 300),
                              'finding_titles': [query_text(item.get('title'), 80) for item in findings[:5] if isinstance(item, dict)]}
              request = {'page': data['page_label'], 'question': question or '解读当前页面，解释关键现象和优先优化方向',
                         'topic_candidates': topics, 'facts_sample': facts, 'data_status': data['data_status'],
                         'selection': {key: query_text(chosen.get(key), 180) for key in ('label', 'text')},
                         'previous_analysis': previous}
              if re.search(r'规划|计划|安排|分工|人手|排期|阶段|优先顺序|先做什么', question):
                  request['topic_candidates'] += '；运营规划、资源约束、任务依赖和阶段交付'
              fallback = (data['page_label'] + '：' + (question[:200] or '经营现象的判断方法与下一步检查') + '。' + request['topic_candidates'])[:512]
              logging.info('advisor_retrieval_input module=%s facts=%s report=%s', module, len(facts), previous is not None)
              return {'request': json.dumps(request, ensure_ascii=False), 'fallback_query': fallback}


          def main(context: str) -> dict:
              """Workflow入口；context为已校验页面快照，返回检索材料，非法快照直接抛错。"""
              return build_retrieval(context, '', 'null', '{}')
        variables:
        - variable: context
          value_selector:
          - prepare
          - context
        outputs:
          request:
            type: string
          fallback_query:
            type: string
      position:
        x: 1032
        y: 0
      positionAbsolute:
        x: 1032
        y: 0
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: query_rewrite
      type: custom
      data:
