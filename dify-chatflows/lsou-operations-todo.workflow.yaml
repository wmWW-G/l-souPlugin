    - id: query_guard
      type: custom
      data:
        type: code
        title: 检查检索词并在必要时回退
        desc: ''
        selected: false
        code_language: python3
        code: |
          """检查检索查询；改写不可用时继续使用本轮问题和页面主题。"""
          import logging
          import re


          def main(rewritten: str, fallback: str) -> dict:
              """接收模型改写文本和程序保底查询；返回有界非空query及来源；非法改写不抛错。"""
              candidate = rewritten.strip() if isinstance(rewritten, str) else ''
              candidate = re.sub(r'<think>.*?(?:</think>|$)', '', candidate, flags=re.S | re.I).strip()
              valid = bool(candidate) and len(candidate) <= 512 and not candidate.startswith(('```', '{', '[', '#'))
              backup = ' '.join(fallback.split())[:512] if isinstance(fallback, str) else ''
              query = ' '.join(candidate.split()) if valid else backup or '国际站经营诊断与运营方法'
              logging.info('advisor_retrieval_query source=%s', 'rewrite' if valid else 'fallback')
              return {'query': query, 'query_source': 'rewrite' if valid else 'fallback'}
        variables:
        - variable: rewritten
          value_selector:
          - query_rewrite
          - text
        - variable: fallback
          value_selector:
          - retrieval_input
          - fallback_query
        outputs:
          query:
            type: string
          query_source:
            type: string
      position:
