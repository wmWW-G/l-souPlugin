    - id: validate_result
      type: custom
      data:
        type: code
        title: 校验JSON并绑定原始证据
        desc: ''
        selected: false
        code_language: python3
        code: |
          """Workflow模型结果校验：绑定当前证据，不把格式错误伪装成没有问题。"""
          import hashlib
          import json


          def main(model_text, context):
              """解析最终JSON并绑定可信范围；参数为模型文本和规范快照字符串；返回对象/JSON，非法输出抛ValueError。"""
              source = json.loads(context)
              text = model_text.strip()
              if '</think>' in text:
                  text = text.rsplit('</think>', 1)[1].strip()
              if text.startswith('```') and text.endswith('```'):
                  text = '\n'.join(text.splitlines()[1:-1])
              try:
                  result = json.loads(text)
              except (ValueError, TypeError):
                  raise ValueError("AI分析未返回有效JSON，请保留已有结果并手动重试。")
              def string(value, limit):
                  """校验非空显示文本；返回原文，非法类型/长度抛ValueError。"""
                  if not isinstance(value, str) or not value.strip() or len(value) > limit:
                      raise ValueError("AI分析字段不符合展示约定。")
                  return value.strip()
              def strings(value, low, high, limit):
                  """校验有界文本列表；参数为数组及数量/字符限制；返回列表或抛ValueError。"""
                  if not isinstance(value, list) or not low <= len(value) <= high:
                      raise ValueError("AI分析列表长度不符合约定。")
                  return [string(item, limit) for item in value]
              if not isinstance(result, dict) or not isinstance(result.get('tasks'), list) or len(result['tasks']) > 5:
                  raise ValueError("AI分析结果不符合约定。")
              facts = {item['id']: item for item in source['facts']}
              entities = {item['ref'] for item in source['entities']}
              actions = {item['id']: item for item in source['available_actions']}
              tasks, used_facts, used_actions = [], set(), set()
              for index, task in enumerate(result['tasks']):
                  if not isinstance(task, dict) or task.get('priority') not in ('high', 'normal', 'low'):
                      raise ValueError("AI诊断项格式或优先级不正确。")
                  ids = strings(task.get('evidence_ids'), 1, 8, 100)
                  if len(set(ids)) != len(ids) or any(fid not in facts for fid in ids):
                      raise ValueError("AI引用了本轮不存在或重复的证据。")
                  ref = task.get('entity_ref', '')
                  if not isinstance(ref, str) or (ref and ref not in entities):
                      raise ValueError("AI引用了不存在的业务对象。")
                  if ref and any(facts[fid]['entity_ref'] not in ('', ref) for fid in ids):
                      raise ValueError("AI将其他商品或客户的证据绑定到了当前对象。")
                  action_ids = strings(task.get('action_ids', []), 0, 3, 100)
                  if any(aid not in actions or actions[aid]['entity_ref'] not in ('', ref) for aid in action_ids):
                      raise ValueError("AI建议的入口未绑定到当前对象。")
                  clean = {key: string(task.get(key), limit) for key, limit in [('title', 80), ('basis', 500)]}
                  clean.update(priority=task['priority'], steps=strings(task.get('steps'), 1, 5, 200),
                               acceptance_criteria=strings(task.get('acceptance_criteria'), 1, 3, 200),
                               hypotheses=strings(task.get('hypotheses'), 0, 3, 200),
                               missing_data=strings(task.get('missing_data'), 0, 4, 200),
                               follow_up_questions=strings(task.get('follow_up_questions'), 1, 3, 100),
                               entity_ref=ref, evidence_ids=ids, action_ids=action_ids, state='suggested',
                               id=hashlib.sha256((source['snapshot_id'] + ':' + str(index) + ':' + clean['title']).encode()).hexdigest()[:20])
                  tasks.append(clean)
                  used_facts.update(ids)
                  used_actions.update(action_ids)
              output = {key: source[key] for key in ('schema_version', 'module', 'snapshot_id', 'as_of', 'period')}
              output.update(status='partial' if source['data_status'] != 'ready' else 'ok',
                            summary=string(result.get('summary'), 400), tasks=tasks,
                            evidence=[item for item in source['facts'] if item['id'] in used_facts],
                            actions=[item for item in source['available_actions'] if item['id'] in used_actions],
                            suggested_questions=strings(result.get('suggested_questions'), 1, 3, 100),
                            limitations=source['limitations'])
              # 旧总览仍读取raw_result.tasks；这里返回校验后的JSON，不透传原模型文本。
              return {'result': output, 'raw_result': json.dumps(output, ensure_ascii=False)}
        variables:
        - variable: model_text
          value_selector:
          - llm_node
          - text
        - variable: context
          value_selector:
          - prepare
          - context
        outputs:
          result:
            type: object
          raw_result:
            type: string
